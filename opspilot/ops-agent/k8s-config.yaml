apiVersion: v1
kind: ConfigMap
metadata:
  name: cc-connect-config
  namespace: aiops
  labels:
    app: cc-connect
data:
  config.toml: |
    language = "zh"
    data_dir = "/data/cc-connect"

    [log]
    level = "info"

    [display]
    thinking_messages = false
    tool_messages = true

    [stream_preview]
    enabled = true
    interval_ms = 1500
    min_delta_chars = 30
    max_chars = 2000

    [[projects]]
    name = "sre-agent"

    [projects.agent]
    type = "acp"

    [projects.agent.options]
    command = "python"
    args = ["-m", "acp_server"]
    work_dir = "/app"
    timeout_mins = 120

    [[projects.platforms]]
    type = "feishu"

    [projects.platforms.options]
    app_id = "${FEISHU_APP_ID}"
    app_secret = "${FEISHU_APP_SECRET}"
    enable_feishu_card = true
    progress_style = "card"
    done_emoji = "Done"

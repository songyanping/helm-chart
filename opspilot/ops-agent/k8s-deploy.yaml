apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: amway-devops-registry-vpc.cn-shenzhen.cr.aliyuncs.com/sre/ops-agent:v202605291027-25c1c8f3-dev
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: false
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: matplotlib-cache
              mountPath: /app/.matplotlib
            - name: workspace
              mountPath: /app/workspace
              # - name: memories
              #   mountPath: /tmp/memories
          resources:
            limits:
              cpu: "2000m"
              memory: "4096Mi"
            requests:
              cpu: "500m"
              memory: "1024Mi"
              #          livenessProbe:
              #            httpGet:
              #              path: /health
              #              port: 8080
              #            initialDelaySeconds: 30
              #            periodSeconds: 10
              #          readinessProbe:
              #            httpGet:
              #              path: /health
              #              port: 8080
              #            initialDelaySeconds: 5
              #            periodSeconds: 10
        - name: cc-connect
          image: amway-devops-registry-vpc.cn-shenzhen.cr.aliyuncs.com/sre/cc-connect:v202605290821-67aa1cab-cc
          imagePullPolicy: IfNotPresent
          ports:
            - name: cc-connect
              containerPort: 1455
          env:
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: cc-connect-secret
                  key: FEISHU_APP_ID
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: cc-connect-secret
                  key: FEISHU_APP_SECRET
          volumeMounts:
            - name: cc-connect-data
              mountPath: /data
            - name: cc-connect-config
              mountPath: /etc/cc-connect/config.toml
              subPath: config.toml
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: "1024Mi"
            requests:
              cpu: "250m"
              memory: "512Mi"
      volumes:
        - name: matplotlib-cache
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: cc-connect-data
          emptyDir: {}
        - name: cc-connect-config
          configMap:
            name: cc-connect-config
            # - name: memories
            #   persistentVolumeClaim:
            #     claimName: agent-memories-pvc # 使用 PVC
      imagePullSecrets:
        - name: amway-devops-registry-vpc.cn-shenzhen.cr.aliyuncs.com

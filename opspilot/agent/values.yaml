replicaCount: 1

nameOverride: "agent-service"
fullnameOverride: "agent-service"

imagePullSecrets:
  - name: amway-devops-registry-vpc.cn-shenzhen.cr.aliyuncs.com

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}

agent:
  image:
    repository: amway-devops-registry-vpc.cn-shenzhen.cr.aliyuncs.com/sre/ops-agent
    tag: "v202605291027-25c1c8f3-dev"
    pullPolicy: IfNotPresent
  securityContext:
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
  resources:
    limits:
      cpu: "2000m"
      memory: "4096Mi"
    requests:
      cpu: "500m"
      memory: "1024Mi"

ccConnect:
  image:
    repository: amway-devops-registry-vpc.cn-shenzhen.cr.aliyuncs.com/sre/cc-connect
    tag: "v202605290821-67aa1cab-cc"
    pullPolicy: IfNotPresent
  credentials:
    feishuAppIdBase64: "Y2xpX2E5NDc2OTQ3OTIyNGRiZDg="
    feishuAppSecretBase64: "TDRvYkdUYjNrWWVWUndxMkh3Y1d1Y1FZRm1EU2p4dWw="
  resources:
    limits:
      cpu: "500m"
      memory: "1024Mi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  config: |
    language = "zh"
    data_dir = "/data/cc-connect"

    [log]
    level = "info"

    [display]
    thinking_messages = false
    tool_messages = true

    [stream_preview]
    enabled = true
    interval_ms = 1500
    min_delta_chars = 30
    max_chars = 2000

    [[projects]]
    name = "sre-agent"

    [projects.agent]
    type = "acp"

    [projects.agent.options]
    command = "python"
    args = ["-m", "acp_server"]
    work_dir = "/app"
    timeout_mins = 120

    [[projects.platforms]]
    type = "feishu"

    [projects.platforms.options]
    app_id = "${FEISHU_APP_ID}"
    app_secret = "${FEISHU_APP_SECRET}"
    enable_feishu_card = true
    progress_style = "card"
    done_emoji = "Done"

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: intranet
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-instance-charge-type: PayBySpec
  ports:
    http: 8080
    ccConnect: 1455

nodeSelector: {}
tolerations: []
affinity: {}
